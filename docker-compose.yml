version: '3.8'

services:
  ecommerce-mongo:
    image: mongo:6.0
    container_name: ecommerce-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ecommerce-network
    restart: always

  ecommerce-redis:
    image: redis:7.0-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network
    restart: always

  ecommerce-ai-service:
    build:
      context: ./AI-Service
      dockerfile: Dockerfile
    container_name: ecommerce-ai-service
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://ecommerce-mongo:27017/competitive_pricing
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_DB_PATH=/app/chroma_db
    volumes:
      - chroma-data:/app/chroma_db
    depends_on:
      - ecommerce-mongo
    networks:
      - ecommerce-network
    restart: always

  ecommerce-server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: ecommerce-server
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://ecommerce-mongo:27017/competitive_pricing
      - REDIS_URL=redis://ecommerce-redis:6379
      - FASTAPI_SERVICE_URL=http://ecommerce-ai-service:8000
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - CRON_SCHEDULE=0 */6 * * *
    depends_on:
      - ecommerce-mongo
      - ecommerce-redis
      - ecommerce-ai-service
    networks:
      - ecommerce-network
    restart: always

  ecommerce-frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "80:80"
    depends_on:
      - ecommerce-server
    networks:
      - ecommerce-network
    restart: always

volumes:
  mongo-data:
  chroma-data:

networks:
  ecommerce-network:
    driver: bridge
